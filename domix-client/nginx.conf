server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # nginx's default (1 MB) silently 413s any request body over it before it ever reaches
    # domix-server — must stay above the client-side caps (see MAX_BYTES in ApartmentImagesDialog.tsx
    # and AccountPage.tsx) or uploads fail with no trace in the app's own logs.
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
    # Ignored by browsers over plain HTTP; takes effect once TLS is terminated in front of this gateway.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Express auth service — mounts its router at /auth, not /api/auth, so the
    # /api prefix is stripped on the way through (mirrors vite.config.ts's dev proxy).
    location /api/auth/ {
        proxy_pass http://auth-server:5000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UserController exposes several unauthenticated endpoints (create, link-google,
    # link-password, lookups by email/username/googleId) that exist only for
    # auth-server to call service-to-service — they must never be reachable from the
    # public internet. The SPA only ever needs by-id (bearer-protected) and
    # profile-image (bearer-protected), so those two are allow-listed explicitly and
    # everything else under /api/User is rejected before it can reach domix-server.
    location /api/User/by-id/ {
        proxy_pass http://domix-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /api/User/profile-image {
        proxy_pass http://domix-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Bearer-protected, enforced server-side: list/block/unblock users (admin),
    # theme preference (self), delete account (self or admin).
    location ~ "^/api/User/(all|theme|[0-9a-fA-F-]{36}(/(block|unblock))?)$" {
        proxy_pass http://domix-server:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/User {
        return 404;
    }

    # PresenceHub (SignalR) — every signed-in client holds a WebSocket connection here.
    location /api/hubs/ {
        proxy_pass http://domix-server:8080/api/hubs/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    # Uploaded apartment photos (ApartmentImageService writes to wwwroot/images/, served by
    # domix-server's own UseStaticFiles()). Marked ^~ so this wins over the extension-based cache
    # rule below, which would otherwise 404 every one of these against nginx's own static root.
    location ^~ /images/ {
        proxy_pass http://domix-server:8080/images/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # .NET data API — its own routes are already "/api/...", so no rewrite here.
    location /api/ {
        proxy_pass http://domix-server:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Long-cache hashed build assets.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|webp|avif)$ {
        try_files $uri =404;
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # Social crawlers (WhatsApp, Facebook, ...) read og:* meta tags but never execute JS, so the
    # normal SPA shell shows them a bare link preview. Route just those User-Agents to
    # ApartmentController.GetOgPreview's tiny server-rendered page instead; every other visitor
    # (including a human who clicked the shared link) still gets the real React app below.
    location ~ "^/apartments/([0-9a-fA-F-]{36})$" {
        # The `if` below runs its own regex match on $http_user_agent, which — a well-known nginx
        # gotcha — clobbers this location's own $1 before it'd otherwise be used in proxy_pass. Save
        # it to a named variable first so the bot branch still gets the right apartment id.
        set $apartment_id $1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($http_user_agent ~* "facebookexternalhit|WhatsApp|Twitterbot|LinkedInBot|Slackbot|TelegramBot|Discordbot|Googlebot|Applebot|Pinterest") {
            proxy_pass http://domix-server:8080/api/Apartment/$apartment_id/og;
            break;
        }
        try_files $uri /index.html;
    }

    # SPA fallback so client-side routes (e.g. /login, /apartments/:id) survive a hard reload.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
