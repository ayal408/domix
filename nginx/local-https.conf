# Local proxy: access logs exclude query strings and identity/verification tokens.
map $http_upgrade $domix_connection_upgrade {
    default upgrade;
    '' close;
}
log_format domix_local_https '$request_method $status $body_bytes_sent $request_time';
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/access.log domix_local_https;
    client_max_body_size 12m;
    location / {
        proxy_pass http://nginx-gateway:80;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $domix_connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
