server {
    listen 80;

    # 1. צד הלקוח (React)
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # 2. ניתוב בקשות אימות לשרת ה-Auth
    location /api/auth {
        proxy_pass http://auth-server:5000; # או הפורט של שרת האימות שלך
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }

    # 3. ניתוב בקשות לשרת הראשי (המתחבר למסד הנתונים)
    location /api {
        proxy_pass http://domix-server:8080; # או הפורט של השרת הרגיל שלך
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
    }
}