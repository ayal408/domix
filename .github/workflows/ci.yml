name: CI

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domix-client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: domix-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Hebrew calendar timezone regression
        run: |
          TZ=Asia/Jerusalem npx vitest run src/components/ui/HebrewDateField.test.tsx
          TZ=America/Los_Angeles npx vitest run src/components/ui/HebrewDateField.test.tsx

      - name: Build
        run: npm run build

  auth-server:
    name: Auth server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: auth-server/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check entry-point syntax
        run: node --check app.js

  backend:
    name: .NET backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domix-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore domix-server.csproj

      - name: Build
        run: dotnet build domix-server.csproj --configuration Release --no-restore

      - name: Unit test
        working-directory: domix-server.Tests
        run: dotnet test domix-server.Tests.csproj --configuration Release

  integration:
    name: Integration (auth-server + domix-server + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: domix_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domix_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install auth-server dependencies
        working-directory: auth-server
        run: npm ci

      - name: Install integration-tests dependencies
        run: npm ci

      - name: Build domix-server (Release, once, so the test run below starts fast)
        working-directory: domix-server
        run: dotnet build domix-server.csproj --configuration Release

      - name: Run integration tests
        run: npm test
        env:
          INTEGRATION_TEST_POSTGRES_URL: "Host=localhost;Port=5432;Database=domix_integration_test;Username=postgres;Password=postgres"

  hosting:
    name: Hosting containers (gateway + API)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: domix_hosting
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domix_hosting"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway and API images
        run: |
          docker build -f deploy/gateway.Dockerfile -t domix-gateway .
          docker build -t domix-api domix-server
      - name: Start disposable deployment
        run: |
          docker run -d --name domix-api --network host -e PORT=8081 \
            -e DEFAULT_CONNECTION='Host=127.0.0.1;Port=5432;Database=domix_hosting;Username=postgres;Password=test-only' \
            -e JWT_SECRET='ci-only-shared-secret-at-least-32-chars' \
            -e INTERNAL_SERVICE_KEY='ci-only-internal-key-at-least-32-chars' domix-api
          docker run -d --name domix-gateway --network host -e PORT=8080 \
            -e DATA_SERVICE_URL=http://127.0.0.1:8081 \
            -e JWT_SECRET='ci-only-shared-secret-at-least-32-chars' \
            -e INTERNAL_SERVICE_KEY='ci-only-internal-key-at-least-32-chars' domix-gateway
      - name: Verify deployed routing and registration
        run: bash deploy/smoke-gateway.sh
      - name: Container logs on failure
        if: failure()
        run: |
          docker logs domix-api || true
          docker logs domix-gateway || true
