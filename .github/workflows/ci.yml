name: CI

on:
  pull_request:
    branches:
      - dev
      - fix/database-integrity
  push:
    branches:
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: domix-client

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate privacy gateway configuration
        run: >-
          docker run --rm --add-host domix-server:127.0.0.1 --add-host auth-server:127.0.0.1
          --volume "$GITHUB_WORKSPACE/domix-client/nginx.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:alpine nginx -t

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: domix-client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Hebrew calendar timezone regression
        run: |
          TZ=Asia/Jerusalem npx vitest run src/components/ui/HebrewDateField.test.tsx
          TZ=America/Los_Angeles npx vitest run src/components/ui/HebrewDateField.test.tsx

      - name: Build
        run: npm run build

  auth-server:
    name: Auth server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auth-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: auth-server/package-lock.json

      - name: Install production dependencies
        run: npm ci --omit=dev

      - name: Check entry-point syntax
        run: node --check app.js

      - name: Authentication regression tests
        run: npm test

  backend:
    name: .NET backend (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: domix-server

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: dotnet restore domix-server.csproj -p:NuGetAuditMode=all '-p:WarningsAsErrors=NU1901;NU1902;NU1903;NU1904'

      - name: Build
        run: dotnet build domix-server.csproj --configuration Release --no-restore

      - name: Unit test
        working-directory: domix-server.Tests
        run: dotnet test domix-server.Tests.csproj --configuration Release

  integration:
    name: Integration (auth-server + domix-server + Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration-tests

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: domix_integration_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d domix_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install auth-server dependencies
        working-directory: auth-server
        run: npm ci

      - name: Install integration-tests dependencies
        run: npm ci

      - name: Build domix-server (Release, once, so the test run below starts fast)
        working-directory: domix-server
        run: dotnet build domix-server.csproj --configuration Release

      - name: Install migration tooling
        run: dotnet tool install --tool-path "${{ runner.temp }}/domix-ef" dotnet-ef --version 8.0.10

      - name: Export migration scripts for clean and populated upgrade tests
        working-directory: domix-server
        env:
          DOTNET_ROLL_FORWARD: Major
          DEFAULT_CONNECTION: "Host=localhost;Database=domix_integration_test;Username=postgres;Password=postgres"
          JWT_SECRET: "integration-test-secret-at-least-32-characters-long"
          INTERNAL_SERVICE_KEY: "integration-test-internal-key-at-least-32-characters-long"
        run: |
          "${{ runner.temp }}/domix-ef/dotnet-ef" migrations has-pending-model-changes --configuration Release --no-build
          "${{ runner.temp }}/domix-ef/dotnet-ef" migrations script --configuration Release --no-build --output ../integration-tests/schema-all.sql
          "${{ runner.temp }}/domix-ef/dotnet-ef" migrations script 0 20261026205318_IntegrationResilience --configuration Release --no-build --output ../integration-tests/schema-before.sql
          "${{ runner.temp }}/domix-ef/dotnet-ef" migrations script 20261026205318_IntegrationResilience --configuration Release --no-build --output ../integration-tests/schema-upgrade.sql

      - name: Run integration tests
        run: npm test
        env:
          INTEGRATION_TEST_POSTGRES_URL: "Host=localhost;Port=5432;Database=domix_integration_test;Username=postgres;Password=postgres"
