name: Build Wii Ghost Hunter

on:
  push:
    paths: ['wii-ghost-hunter/**', '.github/workflows/wii-ghost-hunter.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitppc:latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .dol
        working-directory: wii-ghost-hunter
        run: make
      - name: Package for Homebrew Channel
        run: |
          mkdir -p out/apps/ghost-hunter
          cp wii-ghost-hunter/ghost-hunter.dol out/apps/ghost-hunter/boot.dol
          cp wii-ghost-hunter/meta.xml out/apps/ghost-hunter/meta.xml
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-hunter-wii
          path: out/
