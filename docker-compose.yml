version: '3.8'

services:
  # שער הכניסה (Nginx + React)
  nginx-gateway:
    build:
      context: .
      dockerfile: domix-client/Dockerfile
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - auth-server
      - domix-server
    networks:
      - app-network

  # שרת אימות
  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    env_file:
      - ./auth-server/.env
    ports:
      - "${AUTH_SERVER_PORT:-5000}:5000"
    environment:
      - PORT=${AUTH_SERVER_PORT:-5000}
    networks:
      - app-network

  # שרת רגיל המתחבר לדאטה-בייס
  domix-server:
    build:
      context: ./domix-server
      dockerfile: Dockerfile
    env_file:
      - ./domix-server/.env
    ports:
      - "${DOMIX_SERVER_PORT:-8080}:8080"
    environment:
      - PORT=${DOMIX_SERVER_PORT:-8080}
    networks:
      - app-network

networks:
  app-network:
    driver: bridge