

services:

  nginx-gateway:
    build:
      context: ./domix-client
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    ports:
      - "${NGINX_PORT:-80}:80"
    depends_on:
      - auth-server
      - domix-server
    networks:
      - app-network

  # שרת אימות
  auth-server:
    build:
      context: ./auth-server
      dockerfile: Dockerfile
    env_file:
      - ./auth-server/.env
    ports:
      - "${AUTH_SERVER_PORT:-5000}:5000"
    environment:
      # ./auth-server/.env holds the local-dev value (http://localhost:8080);
      # this override swaps it for the container-network hostname automatically
      # whenever the stack runs via docker compose.
      - PORT=${AUTH_SERVER_PORT:-5000}
      - DATA_SERVICE_URL=http://domix-server:8080
    depends_on:
      - domix-server
    networks:
      - app-network

  # שרת רגיל המתחבר לדאטה-בייס
  domix-server:
    build:
      context: ./domix-server
      dockerfile: Dockerfile
      args:
        # Local dev only — see the Dockerfile's TRUST_LOCAL_DEV_CA comment. A real deployment
        # (Render, etc.) builds the image without this, so it never trusts this CA.
        TRUST_LOCAL_DEV_CA: "true"
    env_file:
      - ./domix-server/.env
    ports:
      - "${DOMIX_SERVER_PORT:-8080}:8080"
    environment:
      # ./domix-server/.env holds the local-dev value (Host=localhost); this
      # override swaps it for the container-network hostname automatically
      # whenever the stack runs via docker compose.
      - PORT=${DOMIX_SERVER_PORT:-8080}
      - DEFAULT_CONNECTION=Host=postgres;Port=5432;Database=${POSTGRES_DB:-domixdb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    volumes:
      # ApartmentImageService writes uploads to wwwroot/images/ on local disk — without a named
      # volume here, every uploaded photo is lost the next time this container is rebuilt/recreated.
      - domix-server-images:/app/wwwroot/images
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-domixdb}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-domixdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
  domix-server-images: