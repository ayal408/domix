# Local browser HTTPS, separate from trust of NetFree's outbound proxy CA.
services:
  local-https:
    image: nginx:alpine
    ports:
      - "${LOCAL_HTTPS_PORT:-443}:443"
    volumes:
      - type: bind
        source: ./nginx/local-https.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCAL_HTTPS_CERT:-./.certs/localhost.pem}
        target: /etc/nginx/certs/server.crt
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${LOCAL_HTTPS_KEY:-./.certs/localhost-key.pem}
        target: /etc/nginx/certs/server.key
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      - nginx-gateway
    networks:
      - app-network
  auth-server:
    environment:
      NODE_ENV: production
  domix-server:
    environment:
      CLIENT_APP_URL: ${DOMIX_LOCAL_CLIENT_URL:-https://localhost}
